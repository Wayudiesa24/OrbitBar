plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbitbar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbitbar.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Reuses the Pixel freeform approach from Orbit-AI-Launcher.
dependencies {
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
